name: Java OJ validation
on:
  push:
    paths:
      - 'java-platform/**'
      - '.github/workflows/java-platform.yml'
  pull_request:
    paths:
      - 'java-platform/**'
      - '.github/workflows/java-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-platform/backend/pom.xml
      - name: Verify Java backend
        working-directory: java-platform/backend
        run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: java-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
